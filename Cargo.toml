[package]
name = "nimbus"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
winit = { version = "0.29", features = ["rwh_06"] }
tiny-skia = "0.11"
cosmic-text = "0.12"
image = { version = "0.24", default-features = false, features = ["png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
llama-cpp-2 = "0.1.146"
tokio-stream = "0.1"
wgpu = "0.19"
tray-icon = "0.14"
mouse_position = "0.1.4"
